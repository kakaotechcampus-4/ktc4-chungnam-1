[project]
name = "ai"
version = "0.1.0"
description = "On-premise AI inference server for Saerok"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.31.0",
    "httpx>=0.28.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "pydantic>=2.12.5",
    "uvicorn>=0.53.0",
    "pyannote-audio>=4,<5",
]

[project.scripts]
ai = "ai.main:run"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
