name: Release build

# 배포 후보 빌드. 같은 커밋에서 제품 테스트를 다시 돌리고, 백엔드 이미지와
# Android 앱을 만든 뒤 커밋 SHA, 이미지 ID, 앱 버전과 Alembic head를 한 요약에 묶는다.
# - 이미지는 레지스트리에 올리지 않는다. 서버는 deploy.yml이 같은 SHA로 다시 빌드한다.
# - 업로드 키 시크릿이 없으면 디버그 키로 서명한 앱을 만들고 요약에 적는다. Play에 올릴 수 없다.
# - 운영 서버, DB, S3, ML API에는 접속하지 않는다.
# 사용법과 설정 항목은 docs/deploy-workflows.md를 따른다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Android versionCode. 비우면 app/pubspec.yaml의 + 뒤 숫자'
        required: false
        type: string
      build_name:
        description: 'Android versionName. 비우면 app/pubspec.yaml의 + 앞 버전'
        required: false
        type: string
      upload_app:
        description: 'APK와 AAB를 artifact로 올림. 공개 저장소에서는 로그인한 GitHub 사용자가 받을 수 있음'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Product tests
    uses: ./.github/workflows/product-tests.yml
    permissions:
      contents: read

  backend-image:
    name: Backend image (api, card-worker, speech-worker)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_id: ${{ steps.build.outputs.image_id }}
      image_digest: ${{ steps.build.outputs.image_digest }}
      alembic_head: ${{ steps.alembic.outputs.head }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # compose.yml의 세 서비스는 같은 saerok-backend 이미지를 쓴다. 한 번만 빌드한다.
      - name: Build image for this commit
        id: build
        run: |
          tag="saerok-backend:${GITHUB_SHA}"
          docker buildx build \
            --build-context ai=../ai \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --metadata-file "${RUNNER_TEMP}/image-metadata.json" \
            --tag "$tag" \
            --load \
            .
          image_id=$(docker image inspect --format '{{.Id}}' "$tag")
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$tag")
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::이미지 revision 라벨($revision)이 커밋($GITHUB_SHA)과 다릅니다."
            exit 1
          fi
          # buildx가 기록한 로컬 이미지 digest. 레지스트리에 올리지 않았으므로 pull할 수 있는 주소가 아니다.
          digest=$(jq -r '."containerimage.digest" // empty' "${RUNNER_TEMP}/image-metadata.json")
          {
            echo "image_tag=$tag"
            echo "image_id=$image_id"
            echo "image_digest=$digest"
          } >> "$GITHUB_OUTPUT"
      # 이미지 안의 migration 파일에서 head를 읽는다. DB에 접속하지 않고 env.py도 실행하지 않는다.
      - name: Read Alembic head from the image
        id: alembic
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          heads=$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "$IMAGE_TAG" python -B -c \
            "from alembic.config import Config; from alembic.script import ScriptDirectory; print(' '.join(ScriptDirectory.from_config(Config('alembic.ini')).get_heads()))")
          count=$(echo "$heads" | wc -w)
          if [ "$count" -ne 1 ]; then
            echo "::error::Alembic head가 하나가 아닙니다: $heads"
            exit 1
          fi
          echo "head=$heads" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.26'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            ai/uv.lock
      # release-safety.md의 이미지 패키지 검사. 네트워크 없이 API와 worker 모듈을 불러온다.
      - name: Check worker imports in the built image
        env:
          SAELOG_PACKAGE_TEST_IMAGE: ${{ steps.build.outputs.image_tag }}
        run: |
          uv sync --locked
          uv run --locked pytest tests/test_container_packages.py -ra
      - name: Save image record
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          ALEMBIC_HEAD: ${{ steps.alembic.outputs.head }}
        run: |
          mkdir -p "${RUNNER_TEMP}/image-record"
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg tag "$IMAGE_TAG" \
            --arg id "$IMAGE_ID" \
            --arg digest "$IMAGE_DIGEST" \
            --arg head "$ALEMBIC_HEAD" \
            '{commit: $sha, imageTag: $tag, imageId: $id, imageDigest: $digest,
              alembicHead: $head, services: ["api", "card-worker", "speech-worker"],
              pushed: false}' \
            > "${RUNNER_TEMP}/image-record/backend-image.json"
          cat "${RUNNER_TEMP}/image-record/backend-image.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-image-record-${{ github.sha }}
          path: ${{ runner.temp }}/image-record/backend-image.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android release build
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      signing: ${{ steps.signing.outputs.mode }}
      apk_sha256: ${{ steps.files.outputs.apk_sha256 }}
      aab_sha256: ${{ steps.files.outputs.aab_sha256 }}
    env:
      # 공개 저장소의 Actions 로그는 누구나 볼 수 있다. 서버 주소를 로그에 남기지 않으려면
      # 같은 이름의 시크릿을 쓴다. 시크릿이 없으면 저장소 변수(vars)를 쓴다.
      SAEROK_API_BASE_URL: ${{ secrets.SAEROK_API_BASE_URL || vars.SAEROK_API_BASE_URL }}
      SAEROK_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SAEROK_GOOGLE_SERVER_CLIENT_ID || vars.SAEROK_GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # app/lib/app/release_config.dart와 같은 기준. 설정 오류 화면만 뜨는 앱을 만들지 않는다.
      - name: Check release build settings
        run: |
          problems=0
          url="$SAEROK_API_BASE_URL"
          if [ -z "$url" ]; then
            echo "::error::SAEROK_API_BASE_URL 저장소 변수나 시크릿이 비어 있습니다."
            problems=1
          elif [[ "$url" != https://* ]]; then
            echo "::error::SAEROK_API_BASE_URL이 https 주소가 아닙니다."
            problems=1
          elif [[ "$url" =~ [[:space:]?#@] ]] || [ "$url" = "https://" ]; then
            echo "::error::SAEROK_API_BASE_URL 형식이 올바르지 않습니다. https://host[:port][/path]만 씁니다."
            problems=1
          fi
          if [ -z "${SAEROK_GOOGLE_SERVER_CLIENT_ID//[[:space:]]/}" ]; then
            echo "::error::SAEROK_GOOGLE_SERVER_CLIENT_ID 저장소 변수나 시크릿이 비어 있습니다."
            problems=1
          fi
          exit "$problems"
      - name: Resolve app version
        id: version
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          line=$(grep -E '^version:' pubspec.yaml)
          if [[ ! "$line" =~ ^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$ ]]; then
            echo "::error::pubspec.yaml의 version 형식을 읽지 못했습니다: $line"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          code="${BASH_REMATCH[2]}"
          source="pubspec.yaml"
          if [ -n "$INPUT_BUILD_NAME" ]; then
            if [[ ! "$INPUT_BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::build_name은 1.2.3 형식이어야 합니다."
              exit 1
            fi
            name="$INPUT_BUILD_NAME"
            source="workflow input"
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            if [[ ! "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
              echo "::error::build_number는 1 이상의 정수여야 합니다."
              exit 1
            fi
            code="$INPUT_BUILD_NUMBER"
            source="workflow input"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$name" ]; then
            echo "::warning::태그 ${GITHUB_REF_NAME}와 versionName ${name}이 다릅니다."
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
      # build.gradle.kts는 android/key.properties가 있을 때만 업로드 키로 서명한다.
      # 시크릿이 하나라도 없으면 파일을 만들지 않고 디버그 키로 서명한다.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            keystore="${RUNNER_TEMP}/upload-keystore.jks"
            # 시크릿에 붙여 넣으며 섞인 줄바꿈(CR/LF), 탭과 공백을 지운 뒤 디코딩한다.
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore"; then
              echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64를 base64로 디코딩하지 못했습니다."
              exit 1
            fi
            chmod 600 "$keystore"
            # 비밀번호와 별칭이 맞는지 빌드 전에 확인한다. 비밀번호는 명령줄 대신 환경 변수로 넘긴다.
            if ! "${JAVA_HOME_17_X64}/bin/keytool" -list -keystore "$keystore" \
              -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
              echo "::error::업로드 키 파일을 열지 못했거나 별칭이 없습니다. 키 파일, 비밀번호, 별칭 시크릿을 확인합니다."
              exit 1
            fi
            {
              echo "storeFile=$keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "mode=upload" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::업로드 키 시크릿이 없어 디버그 키로 서명합니다. 이 빌드는 Play에 올릴 수 없습니다."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Use JDK 17 from the runner image
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build APK and AAB
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          args=(
            --release
            --build-name "$BUILD_NAME"
            --build-number "$BUILD_NUMBER"
            "--dart-define=SAEROK_API_BASE_URL=$SAEROK_API_BASE_URL"
            "--dart-define=SAEROK_GOOGLE_SERVER_CLIENT_ID=$SAEROK_GOOGLE_SERVER_CLIENT_ID"
          )
          flutter build apk "${args[@]}"
          flutter build appbundle "${args[@]}"
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/upload-keystore.jks"
      - name: Check built version and hash files
        id: files
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          SIGNING: ${{ steps.signing.outputs.mode }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          if [[ "$badging" != *"versionCode='$BUILD_NUMBER'"* ]] || [[ "$badging" != *"versionName='$BUILD_NAME'"* ]]; then
            echo "::error::APK의 versionCode/versionName이 요청 값과 다릅니다."
            exit 1
          fi
          out="${RUNNER_TEMP}/android-release"
          mkdir -p "$out"
          cp "$apk" "$out/saerok-${BUILD_NAME}-${BUILD_NUMBER}-${SIGNING}-signed.apk"
          cp "$aab" "$out/saerok-${BUILD_NAME}-${BUILD_NUMBER}-${SIGNING}-signed.aab"
          (cd "$out" && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "aab_sha256=$(sha256sum "$aab" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        # 태그 push에는 입력이 없으므로 올린다. 수동 실행에서는 upload_app 입력을 따른다.
        if: github.event_name != 'workflow_dispatch' || inputs.upload_app
        with:
          name: android-release-${{ github.sha }}
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Release candidate summary
    needs: [tests, backend-image, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write release manifest and job summary
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          IMAGE_RESULT: ${{ needs.backend-image.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IMAGE_TAG: ${{ needs.backend-image.outputs.image_tag }}
          IMAGE_ID: ${{ needs.backend-image.outputs.image_id }}
          IMAGE_DIGEST: ${{ needs.backend-image.outputs.image_digest }}
          ALEMBIC_HEAD: ${{ needs.backend-image.outputs.alembic_head }}
          VERSION_NAME: ${{ needs.android.outputs.version_name }}
          VERSION_CODE: ${{ needs.android.outputs.version_code }}
          SIGNING: ${{ needs.android.outputs.signing }}
          APK_SHA256: ${{ needs.android.outputs.apk_sha256 }}
          AAB_SHA256: ${{ needs.android.outputs.aab_sha256 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/manifest"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg tests "$TESTS_RESULT" \
            --arg imageResult "$IMAGE_RESULT" \
            --arg androidResult "$ANDROID_RESULT" \
            --arg imageTag "$IMAGE_TAG" \
            --arg imageId "$IMAGE_ID" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg head "$ALEMBIC_HEAD" \
            --arg versionName "$VERSION_NAME" \
            --arg versionCode "$VERSION_CODE" \
            --arg signing "$SIGNING" \
            --arg apk "$APK_SHA256" \
            --arg aab "$AAB_SHA256" \
            '{commit: $commit, ref: $ref, run: $run,
              results: {productTests: $tests, backendImage: $imageResult, android: $androidResult},
              backend: {imageTag: $imageTag, imageId: $imageId, imageDigest: $imageDigest, alembicHead: $head, pushed: false},
              android: {versionName: $versionName, versionCode: $versionCode, signing: $signing,
                        apkSha256: $apk, aabSha256: $aab}}' \
            > "${RUNNER_TEMP}/manifest/release-manifest.json"
          {
            echo "## 배포 후보 ${GITHUB_SHA:0:12}"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 커밋 | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| ref | \`${GITHUB_REF}\` |"
            echo "| 제품 테스트 | ${TESTS_RESULT} |"
            echo "| 백엔드 이미지 | ${IMAGE_RESULT} · \`${IMAGE_TAG:-없음}\` |"
            echo "| 이미지 ID | \`${IMAGE_ID:-없음}\` |"
            echo "| 이미지 digest (로컬, push 안 함) | \`${IMAGE_DIGEST:-없음}\` |"
            echo "| Alembic head | \`${ALEMBIC_HEAD:-없음}\` |"
            echo "| Android | ${ANDROID_RESULT} · versionName \`${VERSION_NAME:-없음}\` · versionCode \`${VERSION_CODE:-없음}\` |"
            echo "| 앱 서명 | ${SIGNING:-없음} |"
            echo "| APK SHA-256 | \`${APK_SHA256:-없음}\` |"
            echo "| AAB SHA-256 | \`${AAB_SHA256:-없음}\` |"
            echo
            echo "- 이미지는 레지스트리에 올리지 않았다. 서버 배포는 같은 SHA로 다시 빌드하므로 이미지 ID는 달라질 수 있고, revision 라벨과 Alembic head로 대조한다."
            if [ "$SIGNING" = "debug" ]; then
              echo "- 업로드 키가 없어 디버그 키로 서명했다. Play에 올릴 수 없고 기존 설치본 위에 업데이트되지 않을 수 있다."
            fi
            echo "- 이 요약은 배포 승인이 아니다. 배포는 Deploy workflow와 production 환경 승인을 거친다."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/manifest/release-manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/manifest/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail when a release job failed
        if: needs.tests.result != 'success' || needs.backend-image.result != 'success' || needs.android.result != 'success'
        run: |
          echo "::error::배포 후보 작업 중 성공하지 않은 작업이 있습니다. 이 커밋은 배포 후보가 아닙니다."
          exit 1
