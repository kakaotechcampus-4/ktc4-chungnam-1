name: Deploy (manual)

# 운영 서버 수동 배포. 병합이나 push로는 실행되지 않고 workflow_dispatch로만 시작한다.
# PR에서는 workflow 문법 검사(lint 작업)만 돈다.
#
# mode=check  요청 확인 -> 승인 -> 사전 점검 -> DB 백업과 격리 복원 검사. 서버 코드, 이미지, 컨테이너는 바꾸지 않는다.
# mode=deploy 위에 이어 worker 정지 -> SHA 체크아웃과 빌드 -> alembic upgrade -> 컨테이너 교체
#             -> 사후 점검 -> 배포 기록. migration 전에 실패하면 멈춘 worker를 다시 켠다.
#             migration downgrade, DB 복원, 이미지 되돌리기는 자동으로 하지 않고 안내만 출력한다.
#
# AWS 접근: 운영진이 계정에 만들어 둔 GitHub OIDC 공급자와 이 저장소만 맡을 수 있는 역할
# (ktc-github-deploy, 학생 SSO 세션과 같은 권한)을 쓴다. 장기 액세스 키는 쓰지 않는다.
# 서버 명령은 SSM AWS-RunShellScript로 보낸다. 11/5 수동 배포와 같은 경로다.
#
# 저장소 admin이 GitHub 설정에서 한 번 준비한다. 없으면 첫 단계에서 멈춘다.
# 승인은 workflow 파일이 강제하지 못한다. production 환경을 처음 참조하면 보호 설정 없는 환경이
# 자동으로 생기고, 같은 이름의 시크릿을 저장소 수준에 두면 승인 없이 배포된다. 그래서
# Required reviewers를 먼저 지정하고 시크릿과 변수는 Environment 수준에만 넣는다.
# verify 작업은 production 환경에 Required reviewers가 없으면 멈춘다.
# - Environment `production`: Required reviewers 지정
# - Environment 시크릿: AWS_DEPLOY_ROLE_ARN, DEPLOY_INSTANCE_ID
# - Environment 변수: AWS_REGION, DEPLOY_REPO_DIR, DEPLOY_BACKUP_DIR, DEPLOY_RELEASE_DIR, DEPLOY_COMPOSE_PROFILES
#   (선택: DEPLOY_HOST_USER, DEPLOY_HOST_PYTHON, DEPLOY_COMPOSE_FILES, DEPLOY_SERVICES,
#    DEPLOY_DB_CONTAINER, DEPLOY_DB_NAME, DEPLOY_DB_USER)
# 상세 설정, 되돌리기와 자동화 범위는 docs/deploy-workflows.md를 따른다.
#
# 공개 저장소의 Actions 로그는 누구나 볼 수 있다. 서버 주소, 인스턴스 ID와 .env 값을
# 출력하지 않는다. 서버 안의 점검은 127.0.0.1로만 한다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: 점검과 백업만, deploy: 실제 배포'
        required: true
        type: choice
        options:
          - check
          - deploy
        default: check
      sha:
        description: '대상 전체 40자 커밋 SHA. deploy는 Release build가 성공한 커밋이어야 함'
        required: true
        type: string
      source_branch:
        description: 'SHA가 포함돼 있어야 하는 브랜치'
        required: true
        type: choice
        options:
          - main
          - develop
        default: main
      confirm:
        description: 'mode 뒤에 한 칸 띄우고 SHA 앞 12자리. 예: check 48af8c780416'
        required: true
        type: string
  # 새 workflow를 등록하고 문법을 검사한다. 배포 작업은 돌지 않는다.
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/release-build.yml
      - .github/workflows/product-tests.yml

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다. GitHub는 대기 실행을 하나만 두므로
# 대기 중에 새 요청이 오면 먼저 대기하던 요청이 취소된다. PR 검사는 따로 묶는다.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-production' || format('deploy-lint-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint workflow files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 셸 검사는 서버로 보내는 문자열 안의 스크립트까지 보지 못해 끈다. 그 부분은 배포 작업이 bash -n으로 검사한다.
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 \
            -color -shellcheck= -pyflakes= \
            .github/workflows/deploy.yml .github/workflows/release-build.yml .github/workflows/product-tests.yml

  verify:
    name: Check request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - name: Check inputs
        id: request
        env:
          SHA_INPUT: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ ! "$SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha는 소문자 16진수 40자여야 합니다."
            exit 1
          fi
          if [ "$CONFIRM" != "$MODE ${SHA_INPUT:0:12}" ]; then
            echo "::error::confirm 값이 '$MODE ${SHA_INPUT:0:12}'와 다릅니다."
            exit 1
          fi
          echo "sha=$SHA_INPUT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the commit is on the source branch
        env:
          SHA: ${{ steps.request.outputs.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git cat-file -e "${SHA}^{commit}"
          if ! git merge-base --is-ancestor "$SHA" "origin/${SOURCE_BRANCH}"; then
            echo "::error::${SHA}가 origin/${SOURCE_BRANCH}에 없습니다. 병합된 커밋만 대상으로 합니다."
            exit 1
          fi
      - name: Check that Release build passed for this commit
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.request.outputs.sha }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-build.yml/runs?head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::이 커밋의 성공한 Release build 실행이 없습니다. Release build를 먼저 실행합니다."
            exit 1
          fi
      # 보호 설정 없이 자동 생성된 production 환경으로 승인 없이 실행되는 것을 막는다.
      # 환경이 없거나 조회하지 못해도 멈춘다.
      - name: Check that production requires reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null) || reviewers=0
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::production 환경에 Required reviewers가 없거나 확인하지 못했습니다. 승인자를 먼저 지정합니다."
            exit 1
          fi

  deploy:
    name: ${{ inputs.mode == 'deploy' && 'Deploy to production' || 'Check production' }}
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 단계별 SSM 대기 한도(실행 한도 + 300초)의 합계는 약 205분이다. 그보다 조금 길게 둔다.
    timeout-minutes: 210
    # Required reviewers가 지정돼 있으면 승인 전에는 이 작업이 시작되지 않고, 환경 시크릿도 승인 후에만 주어진다.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ inputs.mode }}
      SHA: ${{ needs.verify.outputs.sha }}
      DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
      DEPLOY_AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
      DEPLOY_BACKUP_DIR: ${{ vars.DEPLOY_BACKUP_DIR }}
      DEPLOY_RELEASE_DIR: ${{ vars.DEPLOY_RELEASE_DIR }}
      DEPLOY_HOST_USER: ${{ vars.DEPLOY_HOST_USER || 'ubuntu' }}
      DEPLOY_HOST_PYTHON: ${{ vars.DEPLOY_HOST_PYTHON || 'python3' }}
      DEPLOY_COMPOSE_FILES: ${{ vars.DEPLOY_COMPOSE_FILES || 'compose.yml' }}
      DEPLOY_COMPOSE_PROFILES: ${{ vars.DEPLOY_COMPOSE_PROFILES }}
      DEPLOY_SERVICES: ${{ vars.DEPLOY_SERVICES || 'api card-worker speech-worker photo-worker' }}
      DEPLOY_DB_CONTAINER: ${{ vars.DEPLOY_DB_CONTAINER || 'saerok-db-1' }}
      DEPLOY_DB_NAME: ${{ vars.DEPLOY_DB_NAME || 'saerok' }}
      DEPLOY_DB_USER: ${{ vars.DEPLOY_DB_USER || 'saerok' }}
    steps:
      # 값은 서버 셸 스크립트에 들어가므로 허용 문자만 통과시킨다. 따옴표와 공백 주입을 막는다.
      - name: Check deploy settings and prepare SSM helper
        env:
          ROLE_ARN_SET: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          fail=0
          need() { if [ -z "$2" ]; then echo "::error::$1이 설정되지 않았습니다."; fail=1; fi; }
          need "시크릿 AWS_DEPLOY_ROLE_ARN" "$([ "$ROLE_ARN_SET" = true ] && echo set)"
          need "시크릿 DEPLOY_INSTANCE_ID" "$DEPLOY_INSTANCE_ID"
          need "변수 AWS_REGION" "$DEPLOY_AWS_REGION"
          need "변수 DEPLOY_REPO_DIR" "$DEPLOY_REPO_DIR"
          need "변수 DEPLOY_BACKUP_DIR" "$DEPLOY_BACKUP_DIR"
          need "변수 DEPLOY_RELEASE_DIR" "$DEPLOY_RELEASE_DIR"
          [ "$fail" = 0 ] || exit 1

          check() { if [[ ! "$2" =~ $3 ]] || [[ "$2" == *..* ]]; then echo "::error::$1 형식이 허용 범위를 벗어났습니다."; fail=1; fi; }
          check MODE "$MODE" '^(check|deploy)$'
          check DEPLOY_INSTANCE_ID "$DEPLOY_INSTANCE_ID" '^i-[0-9a-f]{8,17}$'
          check AWS_REGION "$DEPLOY_AWS_REGION" '^[a-z]{2}(-[a-z]+)+-[0-9]$'
          check DEPLOY_REPO_DIR "$DEPLOY_REPO_DIR" '^/[A-Za-z0-9._/-]+$'
          check DEPLOY_BACKUP_DIR "$DEPLOY_BACKUP_DIR" '^/[A-Za-z0-9._/-]+$'
          check DEPLOY_RELEASE_DIR "$DEPLOY_RELEASE_DIR" '^/[A-Za-z0-9._/-]+$'
          check DEPLOY_HOST_USER "$DEPLOY_HOST_USER" '^[a-z_][a-z0-9_-]*$'
          check DEPLOY_HOST_PYTHON "$DEPLOY_HOST_PYTHON" '^[A-Za-z0-9._/-]+$'
          check DEPLOY_COMPOSE_FILES "$DEPLOY_COMPOSE_FILES" '^[A-Za-z0-9._-][A-Za-z0-9._/-]*( [A-Za-z0-9._-][A-Za-z0-9._/-]*)*$'
          check DEPLOY_SERVICES "$DEPLOY_SERVICES" '^[a-z0-9_-]+( [a-z0-9_-]+)*$'
          check DEPLOY_DB_CONTAINER "$DEPLOY_DB_CONTAINER" '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          check DEPLOY_DB_NAME "$DEPLOY_DB_NAME" '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          check DEPLOY_DB_USER "$DEPLOY_DB_USER" '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          if [ -n "$DEPLOY_COMPOSE_PROFILES" ]; then
            check DEPLOY_COMPOSE_PROFILES "$DEPLOY_COMPOSE_PROFILES" '^[a-z0-9_-]+( [a-z0-9_-]+)*$'
          fi
          if [[ " $DEPLOY_SERVICES " != *" api "* ]]; then
            echo "::error::DEPLOY_SERVICES에 api가 있어야 합니다."
            fail=1
          fi
          case "$DEPLOY_BACKUP_DIR/" in
            "$DEPLOY_REPO_DIR"/*)
              echo "::error::DEPLOY_BACKUP_DIR는 저장소 밖이어야 합니다. 백업에는 개인정보가 들어갈 수 있습니다."
              fail=1
              ;;
          esac
          # 배포 기록과 단계 상태 파일이 저장소 안에 생기면 사전 점검의 변경 판정이 실패한다.
          case "$DEPLOY_RELEASE_DIR/" in
            "$DEPLOY_REPO_DIR"/*)
              echo "::error::DEPLOY_RELEASE_DIR는 저장소 밖이어야 합니다."
              fail=1
              ;;
          esac
          [ "$fail" = 0 ] || exit 1

          # 서버에서 단계마다 앞에 붙는 공통 부분. 값은 위에서 검사했다.
          {
            echo 'set -eu'
            echo 'umask 077'
            printf "MODE='%s'\n" "$MODE"
            printf "SHA='%s'\n" "$SHA"
            printf "RUN_KEY='%s'\n" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            printf "REPO_DIR='%s'\n" "$DEPLOY_REPO_DIR"
            printf "BACKUP_DIR='%s'\n" "$DEPLOY_BACKUP_DIR"
            printf "RELEASE_DIR='%s'\n" "$DEPLOY_RELEASE_DIR"
            printf "HOST_USER='%s'\n" "$DEPLOY_HOST_USER"
            printf "PY='%s'\n" "$DEPLOY_HOST_PYTHON"
            printf "COMPOSE_FILES='%s'\n" "$DEPLOY_COMPOSE_FILES"
            printf "COMPOSE_PROFILES='%s'\n" "$DEPLOY_COMPOSE_PROFILES"
            printf "SERVICES='%s'\n" "$DEPLOY_SERVICES"
            printf "DB_CONTAINER='%s'\n" "$DEPLOY_DB_CONTAINER"
            printf "DB_NAME='%s'\n" "$DEPLOY_DB_NAME"
            printf "DB_USER='%s'\n" "$DEPLOY_DB_USER"
            cat <<'HOST'
          BACKEND_DIR="$REPO_DIR/backend"
          STATE_DIR="$RELEASE_DIR/runs/$RUN_KEY"
          STATE_FILE="$STATE_DIR/state"
          # git 쓰기는 저장소 소유자로 한다. umask 077을 물려주면 checkout한 파일이 0600이 되고,
          # 이미지에 root 소유 0600으로 복사돼 비root 사용자(saerok)가 읽지 못한다. 그래서 022로 낮춘다.
          as_owner() { ( umask 022; sudo -u "$HOST_USER" -H "$@" ); }
          # 읽기는 root에서 safe.directory만 허용한다. git status가 .git/index를 root 소유로
          # 다시 쓰지 않도록 optional lock을 끈다.
          git_read() { GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$REPO_DIR" git --no-optional-locks -C "$REPO_DIR" "$@"; }
          compose_args() {
            for f in $COMPOSE_FILES; do printf '%s %s ' -f "$f"; done
            for p in $COMPOSE_PROFILES; do printf '%s %s ' --profile "$p"; done
          }
          # shellcheck disable=SC2046
          dc() { ( cd "$BACKEND_DIR" && docker compose $(compose_args) "$@" ); }
          state_get() { sed -n "s/^$1=//p" "$STATE_FILE" | tail -n 1; }
          state_set() { echo "$1=$2" >> "$STATE_FILE"; }
          out() { echo "SAEROK_OUT $1=$2"; }
          # api를 뺀 서비스가 worker다.
          workers() { for s in $SERVICES; do [ "$s" = api ] || printf '%s ' "$s"; done; }
          HOST
          } > "$RUNNER_TEMP/host-prelude.sh"

          # 러너에서 쓰는 SSM 실행 함수. 각 단계가 source 한다.
          # 서버 기본 셸과 무관하게 bash로 돌리고, 스크립트 안의 명령이 표준 입력을 읽어도
          # 스크립트 본문을 먹지 않도록 base64로 보내 임시 파일에 쓴 뒤 실행한다.
          cat > "$RUNNER_TEMP/deploy-lib.sh" <<'LIB'
          ssm_run() {
            local name=$1 body=$2 timeout=$3 script params id status deadline output err b64
            script="$RUNNER_TEMP/ssm-$name.sh"
            cat "$RUNNER_TEMP/host-prelude.sh" "$body" > "$script"
            bash -n "$script"
            b64=$(base64 -w0 "$script")
            params="$RUNNER_TEMP/ssm-$name.json"
            jq -n --arg b "$b64" --arg t "$timeout" '{
              commands: [
                "f=$(mktemp /tmp/saerok-deploy.XXXXXX)",
                ("printf %s " + ($b | @sh) + " | base64 -d > \"$f\""),
                "rc=0; bash \"$f\" || rc=$?",
                "rm -f \"$f\"",
                "exit $rc"
              ],
              executionTimeout: [$t]
            }' > "$params"
            id=$(aws ssm send-command \
              --region "$DEPLOY_AWS_REGION" \
              --document-name AWS-RunShellScript \
              --instance-ids "$DEPLOY_INSTANCE_ID" \
              --comment "saerok deploy $name ${SHA:0:12}" \
              --timeout-seconds 600 \
              --parameters "file://$params" \
              --query Command.CommandId --output text)
            deadline=$(( $(date +%s) + timeout + 300 ))
            status=Pending
            while [ "$(date +%s)" -lt "$deadline" ]; do
              sleep 10
              status=$(aws ssm get-command-invocation --region "$DEPLOY_AWS_REGION" \
                --command-id "$id" --instance-id "$DEPLOY_INSTANCE_ID" \
                --query Status --output text 2>/dev/null) || status=Pending
              case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
            done
            output="$RUNNER_TEMP/ssm-$name.out"
            aws ssm get-command-invocation --region "$DEPLOY_AWS_REGION" \
              --command-id "$id" --instance-id "$DEPLOY_INSTANCE_ID" \
              --query StandardOutputContent --output text > "$output" 2>/dev/null || true
            err=$(aws ssm get-command-invocation --region "$DEPLOY_AWS_REGION" \
              --command-id "$id" --instance-id "$DEPLOY_INSTANCE_ID" \
              --query StandardErrorContent --output text 2>/dev/null) || err=""
            echo "::group::$name 출력"
            cat "$output"
            echo "::endgroup::"
            if [ -n "$err" ] && [ "$err" != "None" ]; then
              echo "::group::$name 오류 출력"
              printf '%s\n' "$err"
              echo "::endgroup::"
            fi
            # 서버가 남긴 값 중 정해진 형식만 단계 출력으로 옮긴다.
            grep -E '^SAEROK_OUT [A-Z_]+=[A-Za-z0-9:._, -]*$' "$output" | sed 's/^SAEROK_OUT //' >> "$GITHUB_OUTPUT" || true
            case "$status" in
              Pending|InProgress|Delayed)
                # 대기 기한을 넘겼다. 중간에 끊으면 migration이나 컨테이너 교체가 반쯤 남을 수 있어 취소하지 않는다.
                echo "::error::$name 단계의 SSM 명령이 대기 기한 안에 끝나지 않았습니다(상태: $status). 서버에서 아직 실행 중일 수 있습니다. 명령 ID $id가 끝난 것을 확인하기 전에는 다시 배포하거나 되돌리지 않습니다."
                return 1
                ;;
            esac
            if [ "$status" != "Success" ]; then
              echo "::error::$name 단계가 끝나지 않았습니다. SSM 상태: $status"
              return 1
            fi
          }
          LIB
          bash -n "$RUNNER_TEMP/host-prelude.sh"
          bash -n "$RUNNER_TEMP/deploy-lib.sh"

      # 장기 액세스 키 대신 GitHub OIDC로 짧은 자격증명을 받는다.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: saerok-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: 1. Pre-check (tools, checkout, ready, running jobs)
        id: precheck
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          for tool in docker git curl sudo sed; do
            command -v "$tool" >/dev/null 2>&1 || { echo "MISSING_TOOL $tool"; exit 1; }
          done
          docker compose version
          "$PY" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' \
            || { echo "HOST_PYTHON_TOO_OLD: scripts/에는 Python 3.11 이상이 필요합니다"; exit 1; }
          [ -d "$BACKEND_DIR" ] || { echo "REPO_DIR_NOT_FOUND"; exit 1; }
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"
          : > "$STATE_FILE"

          # 추적 파일이 바뀐 서버에서는 배포하지 않는다. 추적하지 않는 새 파일(메모 등)은 이미지에
          # 들어가지 않으므로(Dockerfile이 필요한 폴더만 복사) 막지 않고 개수만 남긴다.
          # 공개 로그이므로 파일 이름은 출력하지 않는다. 서버에서 git status로 확인한다.
          tracked=$(git_read status --porcelain --untracked-files=no)
          if [ -n "$tracked" ]; then
            echo "REPO_DIRTY: 서버 저장소의 추적 파일이 바뀌어 있습니다"
            echo "REPO_DIRTY_COUNT $(printf '%s\n' "$tracked" | wc -l)"
            exit 1
          fi
          echo "REPO_UNTRACKED_COUNT $(git_read status --porcelain | grep -c '^??' || true)"
          previous_sha=$(git_read rev-parse HEAD)
          previous_branch=$(git_read symbolic-ref -q --short HEAD || true)
          echo "SERVER_CHECKOUT ${previous_sha:0:12} ${previous_branch:-detached}"

          api_id=$(dc ps -q api)
          [ -n "$api_id" ] || { echo "API_NOT_RUNNING: 실행 중인 api가 없어 자동 배포 대상이 아닙니다"; exit 1; }
          previous_image=$(docker inspect --format '{{.Image}}' "$api_id")
          previous_revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$api_id")
          # 이번 배포로 처음 들어오는 worker(컨테이너가 아직 없음)는 막지 않는다. 있는데 멈춘 worker만 막는다.
          for s in $(workers); do
            if [ -z "$(dc ps -a -q "$s")" ]; then echo "WORKER_NEW $s"; continue; fi
            [ -n "$(dc ps -q "$s")" ] || { echo "WORKER_NOT_RUNNING $s"; exit 1; }
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/health/ready || true)
          [ "$code" = "200" ] || { echo "READY_CHECK_FAILED http=$code"; exit 1; }
          echo "health/ready 200"

          # 처리 중 작업 판정. worker 정지 직전에도 다시 쓴다. 0 없음, 1 있음, 2 읽지 못함.
          # 전체 결과(행 수 집계 포함)는 서버의 STATE_DIR에만 둔다. 공개 로그에는 판정에 쓴 값만 남긴다.
          cat > "$STATE_DIR/active_jobs.py" <<'PY'
          import json
          import sys

          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              print("RUNTIME_CHECK_UNREADABLE")
              sys.exit(2)
          issues = data.get("issues", [])
          print("RUNTIME_ISSUES " + (",".join(sorted(issues)) or "none"))
          database = data.get("database") or {}
          blocking = {"DATABASE_INSPECTION_FAILED", "INVALID_CONFIGURATION", "DATABASE_NOT_CONFIGURED"}
          if blocking & set(issues) or not database:
              print("RUNTIME_DATABASE_FAILED")
              sys.exit(2)
          counts = database.get("counts", {})
          attention = database.get("attention", {})
          speech = sum(counts.get("speech", {}).get(s, 0) for s in ("uploading", "transcribing", "generatingReport"))
          speech -= attention.get("expired_speech_leases", 0)
          cards = counts.get("cards", {}).get("running", 0) - attention.get("expired_card_leases", 0)
          photos = counts.get("photos", {}).get("processing", 0)
          print(f"ACTIVE_JOBS speech={speech} cards={cards} photos={photos}")
          print("SAEROK_OUT DB_REVISION=" + ",".join(database.get("revisions") or []))
          sys.exit(1 if speech > 0 or cards > 0 or photos > 0 else 0)
          PY
          dc exec -T api python -m app.ops.runtime_check > "$STATE_DIR/runtime-before.json" || true
          rc=0
          "$PY" "$STATE_DIR/active_jobs.py" "$STATE_DIR/runtime-before.json" || rc=$?
          [ "$rc" -ne 2 ] || exit 1
          if [ "$rc" -eq 1 ]; then
            if [ "$MODE" = deploy ]; then
              echo "IN_PROGRESS_WORK: 처리 중인 작업이 끝난 뒤 다시 실행합니다"
              exit 1
            fi
            echo "IN_PROGRESS_WORK: 점검 모드라 멈추지 않습니다. 배포 때는 이 상태면 멈춥니다"
          fi

          state_set PREVIOUS_SHA "$previous_sha"
          state_set PREVIOUS_BRANCH "$previous_branch"
          state_set PREVIOUS_IMAGE_ID "$previous_image"
          out PREVIOUS_SHA "$previous_sha"
          out PREVIOUS_IMAGE_ID "$previous_image"
          out PREVIOUS_IMAGE_REVISION "${previous_revision:-unknown}"
          if [ "$MODE" = deploy ]; then
            # 이전 이미지를 태그로 보존한다. 같은 이름의 태그가 다른 내용을 가리킨다고 추측하지 않도록 ID도 남긴다.
            rollback_tag="saerok-backend:rollback-$RUN_KEY"
            docker tag "$previous_image" "$rollback_tag"
            state_set ROLLBACK_TAG "$rollback_tag"
            out ROLLBACK_TAG "$rollback_tag"
          fi
          HOST
          ssm_run precheck "$RUNNER_TEMP/step.sh" 600

      - name: 2. Back up the database and verify an isolated restore
        id: backup
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          # 복원한 표의 행 수 같은 운영 정보는 공개 로그에 남기지 않는다. 전체 결과는 STATE_DIR/backup.json에 있다.
          backup_summary() {
            "$PY" -c 'import json, sys
          keys = ("restoreVerified", "archive", "sha256", "stage", "errorCode", "error", "cleanupError")
          try:
              d = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              print("BACKUP_RESULT_UNREADABLE")
          else:
              print(json.dumps({k: d[k] for k in keys if k in d}, ensure_ascii=False))' "$STATE_DIR/backup.json" || true
          }
          # backend/docs/release-safety.md의 도구. 새 파일만 만들고 운영 DB에 쓰지 않는다.
          if ! "$PY" "$BACKEND_DIR/scripts/verify_database_backup.py" \
            --source-container "$DB_CONTAINER" \
            --source-database "$DB_NAME" \
            --source-user "$DB_USER" \
            --backup-dir "$BACKUP_DIR" > "$STATE_DIR/backup.json"; then
            backup_summary
            echo "BACKUP_FAILED"
            exit 1
          fi
          backup_summary
          archive=$("$PY" -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); print(d["archive"] if d.get("restoreVerified") is True else "")' "$STATE_DIR/backup.json")
          [ -n "$archive" ] || { echo "BACKUP_NOT_VERIFIED"; exit 1; }
          state_set BACKUP_ARCHIVE "$archive"
          out BACKUP_ARCHIVE "$(basename "$archive")"
          HOST
          ssm_run backup "$RUNNER_TEMP/step.sh" 1800

      # 1단계 뒤에 새 작업이 시작됐을 수 있어 멈추기 직전에 다시 확인한다. worker는 SIGTERM을 받으면
      # 처리 중 작업을 마치고 끝난다(compose의 stop_grace_period, 녹음 최대 1860초). -t로 줄이지 않는다.
      # API는 계속 받는다. 그사이 들어온 분석과 카드 요청은 대기열에 남았다가 새 worker가 처리한다.
      - name: 3. Stop workers
        id: stop_workers
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          dc exec -T api python -m app.ops.runtime_check > "$STATE_DIR/runtime-before-stop.json" || true
          rc=0
          "$PY" "$STATE_DIR/active_jobs.py" "$STATE_DIR/runtime-before-stop.json" || rc=$?
          [ "$rc" -eq 0 ] || { echo "IN_PROGRESS_WORK: worker를 멈추지 않았습니다. 작업이 끝난 뒤 다시 실행합니다"; exit 1; }
          list=$(workers)
          state_set WORKERS "$list"
          # shellcheck disable=SC2086
          dc stop $list
          echo "WORKERS_STOPPED $list"
          HOST
          ssm_run stop-workers "$RUNNER_TEMP/step.sh" 2100

      - name: 4. Check out the commit and build the image
        id: build
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          image_ref=""
          # 이 단계가 중간에 끝나면 서버 체크아웃과 이미지 이름을 이전 상태로 되돌린다. 실행 중인 api는 아직 그대로다.
          restore_on_failure() {
            previous_branch=$(state_get PREVIOUS_BRANCH)
            if [ -n "$previous_branch" ]; then
              as_owner git -C "$REPO_DIR" checkout -q "$previous_branch" || true
            else
              as_owner git -C "$REPO_DIR" checkout -q --detach "$(state_get PREVIOUS_SHA)" || true
            fi
            if [ -n "$image_ref" ]; then
              docker tag "$(state_get ROLLBACK_TAG)" "$image_ref" || true
            fi
            echo "CHECKOUT_RESTORED"
          }
          trap 'restore_on_failure' EXIT
          as_owner git -C "$REPO_DIR" fetch -q --no-tags origin "$SHA"
          as_owner git -C "$REPO_DIR" checkout -q --detach "$SHA"
          [ "$(git_read rev-parse HEAD)" = "$SHA" ] || { echo "CHECKOUT_MISMATCH"; exit 1; }

          # compose 설정 원문에는 .env 값이 들어갈 수 있다. 이미지 이름만 꺼내고 출력하지 않는다.
          image_ref=$(dc config --format json | "$PY" -c 'import json, sys; print(json.load(sys.stdin)["services"]["api"]["image"])')
          if ! dc build --build-arg "SOURCE_REVISION=$SHA" api > "$STATE_DIR/build.log" 2>&1; then
            tail -n 80 "$STATE_DIR/build.log"
            echo "BUILD_FAILED"
            exit 1
          fi
          tail -n 20 "$STATE_DIR/build.log"

          new_image=$(docker image inspect --format '{{.Id}}' "$image_ref")
          label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_ref")
          if [ "$label" != "$SHA" ]; then
            echo "IMAGE_REVISION_MISMATCH label=$label"
            exit 1
          fi
          head=$(docker run --rm --network none --read-only "$new_image" python -B -c \
            "from alembic.config import Config; from alembic.script import ScriptDirectory; print(' '.join(ScriptDirectory.from_config(Config('alembic.ini')).get_heads()))")
          case "$head" in
            *" "*|"") echo "ALEMBIC_HEAD_NOT_SINGLE $head"; exit 1 ;;
          esac
          docker tag "$new_image" "saerok-backend:$SHA"
          trap - EXIT
          state_set IMAGE_REF "$image_ref"
          state_set NEW_IMAGE_ID "$new_image"
          state_set ALEMBIC_HEAD "$head"
          out IMAGE_REF "$image_ref"
          out NEW_IMAGE_ID "$new_image"
          out ALEMBIC_HEAD "$head"
          HOST
          ssm_run build "$RUNNER_TEMP/step.sh" 1800

      - name: 5. Apply database migrations
        id: migrate
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          # init.sql, DB 재생성, compose down -v는 쓰지 않는다.
          dc run --rm --no-deps api alembic upgrade head
          HOST
          ssm_run migrate "$RUNNER_TEMP/step.sh" 900

      - name: 6. Replace containers
        id: up
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          # shellcheck disable=SC2086
          dc up -d --no-build $SERVICES
          dc ps
          HOST
          ssm_run up "$RUNNER_TEMP/step.sh" 900

      - name: 7. Post-check (live, ready, migration revision)
        id: postcheck
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          wait_ok() {
            tries=0
            until [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$1" || true)" = "200" ]; do
              tries=$((tries + 1))
              [ "$tries" -lt 24 ] || { echo "CHECK_FAILED $1"; exit 1; }
              sleep 5
            done
            echo "$1 200"
          }
          wait_ok /health/live
          wait_ok /health/ready
          for s in $(workers); do
            [ -n "$(dc ps -q --status running "$s")" ] || { echo "WORKER_NOT_RUNNING $s"; exit 1; }
          done
          head=$(state_get ALEMBIC_HEAD)
          dc exec -T api python -m app.ops.runtime_check --expected-revision "$head" > "$STATE_DIR/runtime-after.json" || true
          "$PY" - "$STATE_DIR/runtime-after.json" <<'PY'
          import json
          import sys

          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              print("POSTCHECK_RUNTIME_CHECK_UNREADABLE")
              sys.exit(1)
          issues = set(data.get("issues", []))
          database = data.get("database") or {}
          if issues & {"MIGRATION_MISMATCH", "DATABASE_INSPECTION_FAILED", "INVALID_CONFIGURATION"}:
              print("POSTCHECK_FAILED " + ",".join(sorted(issues)))
              sys.exit(1)
          if database.get("revisionMatches") is not True:
              print("POSTCHECK_REVISION_NOT_CONFIRMED")
              sys.exit(1)
          if issues:
              print("POSTCHECK_ATTENTION " + ",".join(sorted(issues)))
          print("POSTCHECK_REVISION " + ",".join(database.get("revisions") or []))
          PY
          HOST
          ssm_run postcheck "$RUNNER_TEMP/step.sh" 600

      - name: 8. Record the release
        id: record
        if: env.MODE == 'deploy'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          args=""
          # shellcheck disable=SC2086
          for id in $(dc ps -q $SERVICES); do args="$args --container $id"; done
          for f in $COMPOSE_FILES; do args="$args --compose-file $BACKEND_DIR/$f"; done
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          record="$RELEASE_DIR/release-$stamp-$(echo "$SHA" | cut -c1-12).json"
          # backend/docs/release-safety.md의 도구. 환경 변수와 로그는 읽지 않는다.
          # capture_release.py의 git status가 .git/index를 root 소유로 다시 쓰지 않게 한다.
          # shellcheck disable=SC2086
          GIT_OPTIONAL_LOCKS=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$REPO_DIR" \
            "$PY" "$BACKEND_DIR/scripts/capture_release.py" --repo "$REPO_DIR" $args > "$record"
          cp "$STATE_FILE" "$record.state"
          cat "$record"
          # capture_release.py의 worktreeDirty는 추적하지 않는 파일도 센다. 1단계와 같이 추적 파일 변경만 문제로 본다.
          tracked_dirty=$(git_read status --porcelain --untracked-files=no | wc -l)
          "$PY" - "$record" "$SHA" "$SERVICES" "$tracked_dirty" <<'PY'
          import json
          import sys

          record = json.load(open(sys.argv[1], encoding="utf-8"))
          sha, services, tracked_dirty = sys.argv[2], set(sys.argv[3].split()), int(sys.argv[4])
          problems = []
          if record.get("gitCommit") != sha:
              problems.append("GIT_COMMIT_MISMATCH")
          if tracked_dirty:
              problems.append("WORKTREE_DIRTY")
          elif record.get("worktreeDirty"):
              print("RELEASE_RECORD_NOTE 추적하지 않는 파일만 있습니다")
          seen = set()
          for item in record.get("containers", []):
              seen.add(item.get("service"))
              if item.get("sourceRevision") != sha:
                  problems.append(f"IMAGE_REVISION_MISMATCH:{item.get('service')}")
              if item.get("status") != "running":
                  problems.append(f"NOT_RUNNING:{item.get('service')}")
          missing = services - seen
          if missing:
              problems.append("MISSING_SERVICE:" + ",".join(sorted(missing)))
          if problems:
              print("RELEASE_RECORD_PROBLEMS " + " ".join(problems))
              sys.exit(1)
          print("RELEASE_RECORD_OK")
          PY
          out RELEASE_RECORD "$(basename "$record")"
          HOST
          ssm_run record "$RUNNER_TEMP/step.sh" 300

      # worker를 멈춘 뒤 migration 전에 실패했다(빌드 실패 등). DB와 실행 중인 api는 배포 전 그대로이고,
      # 빌드 단계가 체크아웃과 이미지 이름을 되돌렸으므로 멈춘 worker 컨테이너를 그대로 다시 켠다.
      # migration이 시작됐으면 DB 상태가 확실하지 않으므로 켜지 않고 되돌리기 안내를 따른다.
      - name: Restart workers after a failure before migration
        id: restart_workers
        if: >-
          failure() &&
          env.MODE == 'deploy' &&
          steps.stop_workers.outcome != 'skipped' &&
          steps.migrate.outcome == 'skipped'
        run: |
          source "$RUNNER_TEMP/deploy-lib.sh"
          cat > "$RUNNER_TEMP/step.sh" <<'HOST'
          list=$(state_get WORKERS)
          [ -n "$list" ] || list=$(workers)
          # shellcheck disable=SC2086
          dc start $list
          dc ps
          echo "WORKERS_RESTARTED $list"
          HOST
          ssm_run restart-workers "$RUNNER_TEMP/step.sh" 600

      - name: Write summary
        if: always()
        env:
          PREVIOUS_SHA: ${{ steps.precheck.outputs.PREVIOUS_SHA }}
          PREVIOUS_IMAGE_ID: ${{ steps.precheck.outputs.PREVIOUS_IMAGE_ID }}
          PREVIOUS_IMAGE_REVISION: ${{ steps.precheck.outputs.PREVIOUS_IMAGE_REVISION }}
          DB_REVISION: ${{ steps.precheck.outputs.DB_REVISION }}
          BACKUP_ARCHIVE: ${{ steps.backup.outputs.BACKUP_ARCHIVE }}
          NEW_IMAGE_ID: ${{ steps.build.outputs.NEW_IMAGE_ID }}
          ALEMBIC_HEAD: ${{ steps.build.outputs.ALEMBIC_HEAD }}
          RELEASE_RECORD: ${{ steps.record.outputs.RELEASE_RECORD }}
          OUTCOMES: >-
            precheck=${{ steps.precheck.outcome }}
            backup=${{ steps.backup.outcome }}
            stop_workers=${{ steps.stop_workers.outcome }}
            build=${{ steps.build.outcome }}
            migrate=${{ steps.migrate.outcome }}
            up=${{ steps.up.outcome }}
            postcheck=${{ steps.postcheck.outcome }}
            record=${{ steps.record.outcome }}
            restart_workers=${{ steps.restart_workers.outcome }}
        run: |
          {
            echo "## ${MODE} ${SHA:0:12}"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 모드 | \`${MODE}\` |"
            echo "| 대상 커밋 | \`${SHA}\` |"
            echo "| 서버의 이전 커밋 | \`${PREVIOUS_SHA:-미확인}\` |"
            echo "| 이전 이미지 ID | \`${PREVIOUS_IMAGE_ID:-미확인}\` (revision 라벨 \`${PREVIOUS_IMAGE_REVISION:-미확인}\`) |"
            echo "| 새 이미지 ID | \`${NEW_IMAGE_ID:-없음}\` |"
            echo "| DB revision (시작 전) | \`${DB_REVISION:-미확인}\` |"
            echo "| Alembic head (새 이미지) | \`${ALEMBIC_HEAD:-없음}\` |"
            echo "| 백업 파일 | \`${BACKUP_ARCHIVE:-없음}\` |"
            echo "| 배포 기록 파일 | \`${RELEASE_RECORD:-없음}\` |"
            echo "| 단계 결과 | ${OUTCOMES} |"
            echo
            echo "- 기능 확인(로그인, 카드 생성, 녹음부터 리포트, 다음 카드)과 옛 앱/새 앱 확인은 이 workflow가 하지 않는다. release-safety.md 6, 7단계를 사람이 확인한다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 시간 초과나 취소로 끝나도 안내한다. 이때 서버의 SSM 명령은 계속 실행 중일 수 있다.
      - name: Print rollback instructions
        if: (failure() || cancelled()) && env.MODE == 'deploy'
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIOUS_SHA: ${{ steps.precheck.outputs.PREVIOUS_SHA }}
          PREVIOUS_IMAGE_ID: ${{ steps.precheck.outputs.PREVIOUS_IMAGE_ID }}
          ROLLBACK_TAG: ${{ steps.precheck.outputs.ROLLBACK_TAG }}
          IMAGE_REF: ${{ steps.build.outputs.IMAGE_REF }}
          STOP_OUTCOME: ${{ steps.stop_workers.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          RESTART_OUTCOME: ${{ steps.restart_workers.outcome }}
        run: |
          compose="docker compose"
          for f in $DEPLOY_COMPOSE_FILES; do compose="$compose -f $f"; done
          for p in $DEPLOY_COMPOSE_PROFILES; do compose="$compose --profile $p"; done
          workers=""
          for s in $DEPLOY_SERVICES; do [ "$s" = api ] || workers="$workers $s"; done
          {
            echo "## 되돌리기 안내"
            echo
            echo "자동 되돌리기는 하지 않았다. 아래는 서버의 \`\$DEPLOY_REPO_DIR/backend\`에서 사람이 판단해 실행한다."
            echo
            if [ "$JOB_STATUS" = "cancelled" ]; then
              echo "이 실행은 취소되었거나 시간 초과로 끝났다. 서버의 SSM 명령은 실행기와 별개로 계속 돌 수 있다. AWS SSM의 명령 기록(설명 \`saerok deploy <단계> ${SHA:0:12}\`)에서 마지막 명령이 끝났는지 먼저 확인하고, 끝나기 전에는 아래 명령을 실행하지 않는다."
              echo
            fi
            echo "- 이전 커밋: \`${PREVIOUS_SHA:-미확인}\`"
            echo "- 이전 이미지 ID: \`${PREVIOUS_IMAGE_ID:-미확인}\` (보존 태그 \`${ROLLBACK_TAG:-없음}\`)"
            echo
            # migration 단계가 실행됐다면 실패했더라도 DB 상태를 확인 전까지 알 수 없는 것으로 본다.
            if [ -n "$MIGRATE_OUTCOME" ] && [ "$MIGRATE_OUTCOME" != "skipped" ]; then
              echo "migration 단계가 실행됐다(결과: ${MIGRATE_OUTCOME}). 실패했어도 일부 revision이 적용됐을 수 있으므로 \`alembic current\`로 DB revision을 먼저 확인한다. worker는 멈춘 채일 수 있다(\`$compose ps\`로 확인)."
              echo
              echo "1. 이전 이미지가 새 DB 스키마를 읽을 수 있는지 먼저 확인한다. 확인하지 못하면 이미지를 되돌리지 않는다."
              echo "2. 호환이 확인되면 이전 이미지 ID를 다시 대조한 뒤 아래를 실행한다."
              echo
              echo '```bash'
              echo "docker image inspect --format '{{.Id}}' ${ROLLBACK_TAG:-<보존 태그>}   # ${PREVIOUS_IMAGE_ID:-이전 이미지 ID}와 같아야 함"
              echo "docker tag ${ROLLBACK_TAG:-<보존 태그>} ${IMAGE_REF:-saerok-backend}"
              echo "$compose up -d --no-build $DEPLOY_SERVICES"
              echo "sudo -u <저장소 소유자> git -C \"\$DEPLOY_REPO_DIR\" checkout --detach ${PREVIOUS_SHA:-<이전 커밋>}"
              echo '```'
              echo
              echo "3. alembic downgrade와 운영 DB 복원은 자동으로 하지 않는다. 필요하면 backend/docs/release-safety.md의 \"이상이 생겼을 때\"에 따라 손실 범위와 승인자를 먼저 정한다. 백업 파일은 위 요약 표에 있다."
              echo "4. 이 workflow로 이전 커밋을 다시 배포하면 이전 코드에 없는 revision 때문에 alembic upgrade가 실패할 수 있다."
            else
              echo "migration 전에 멈췄다. DB와 실행 중인 api는 배포 전 그대로다."
              echo
              echo "- 빌드 단계에서 실패했다면 서버 체크아웃과 이미지 이름은 자동으로 이전 상태로 돌아갔다(출력의 CHECKOUT_RESTORED 확인)."
              if [ -z "$STOP_OUTCOME" ] || [ "$STOP_OUTCOME" = "skipped" ]; then
                echo "- worker는 멈추지 않았다."
              elif [ "$RESTART_OUTCOME" = "success" ]; then
                echo "- 멈췄던 worker를 다시 켰다(출력의 WORKERS_RESTARTED 확인)."
              else
                echo "- worker가 멈춘 채일 수 있다. 상태를 보고 멈춰 있으면 다시 켠다."
                echo
                echo '```bash'
                echo "$compose ps"
                echo "$compose start$workers"
                echo '```'
              fi
              echo "- 원인을 고친 뒤 같은 SHA로 다시 실행하거나, 이 실행을 기록만 남기고 끝낸다."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
