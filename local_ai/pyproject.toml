[project]
name = "saerok-local-ai"
version = "0.1.0"
description = "Saerok card generation, visit report and change proposals (backend imports these packages)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.6,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["card_generation/tests/unit", "report_generation/tests", "proposal_generation/tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# backend가 경로 의존성으로 설치하는 것은 생성 기능 셋과 공통 모듈뿐. 시뮬레이터, 평가, 테스트는 넣지 않음
packages = ["common", "card_generation", "report_generation", "proposal_generation"]
exclude = ["card_generation/tests", "report_generation/tests", "proposal_generation/tests"]

[tool.uv]
package = true
