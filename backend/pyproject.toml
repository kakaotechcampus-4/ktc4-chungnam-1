[project]
name = "saerok-backend"
version = "0.1.0"
description = "Local FastAPI reference environment for Saerok"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.141.1,<0.142",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
